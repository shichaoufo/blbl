name: Android Release

# 正式发布：编译 release APK 并发布到 GitHub Releases。
#
# 两种触发方式：
#   1. push tag（如 `git push origin v0.1.30`）—— 版本号直接取 tag 名；
#   2. 手动 Run workflow —— 自己填 version_name。
#
# 签名：优先用仓库 secrets 里的正式 keystore；没配就回退到 CI 临时生成的密钥，
# 这样 workflow 始终能跑通（临时密钥每次不同，装的时候需要先卸载旧包）。
# 若要固定签名，往仓库 secrets 里放这四个即可：
#   RELEASE_KEYSTORE_BASE64（keystore 的 base64）、RELEASE_STORE_PASSWORD、
#   RELEASE_KEY_ALIAS、RELEASE_KEY_PASSWORD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 0.1.30)"
        required: true
      changelog:
        description: "Release notes/changelog (optional; supports multiline)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Resolve version name
        id: version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            RAW="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.version_name }}" ]; then
            RAW="${{ inputs.version_name }}"
          else
            RAW="$(grep -m1 -oP '^## \K[0-9.]+' CHANGELOG.md)"
          fi
          CLEAN="${RAW#v}"
          if [ -z "$CLEAN" ]; then
            echo "无法解析版本号" >&2
            exit 1
          fi
          echo "version=$CLEAN" >> "$GITHUB_OUTPUT"
          echo "构建版本：$CLEAN"

      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PW: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p keystore
          if [ -n "${KS_B64:-}" ] && [ -n "${STORE_PW:-}" ] && [ -n "${KEY_ALIAS:-}" ]; then
            echo "使用仓库 secrets 里的正式 keystore"
            printf '%s' "$KS_B64" | base64 -d > keystore/release.keystore
            echo "RELEASE_STORE_PASSWORD=$STORE_PW" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$KEY_PW" >> "$GITHUB_ENV"
          else
            echo "::warning::未配置 RELEASE_KEYSTORE_BASE64，改用 CI 临时密钥签名（每次签名不同，安装前需卸载旧包）"
            keytool -genkeypair -v \
              -keystore keystore/release.keystore \
              -alias blbl-animate \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass android -keypass android \
              -dname "CN=blbl-animate, OU=blbl, O=blbl-animate, L=, S=, C=CN"
            echo "RELEASE_STORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=blbl-animate" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease -PversionName=${{ steps.version.outputs.version }} -PversionCode=${{ github.run_number }}

      - name: Prepare named release APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          OUT="app/build/outputs/apk/release/blbl-animate-${VERSION_NAME}-release.apk"
          cp "app/build/outputs/apk/release/app-release.apk" "$OUT"
          echo "DOWNLOAD_APK=$OUT" >> "$GITHUB_ENV"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: blbl-animate-${{ steps.version.outputs.version }}-release
          path: ${{ env.DOWNLOAD_APK }}

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.version }}
          RELEASE_TAG: v${{ steps.version.outputs.version }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          set -euo pipefail
          if [ -z "${CHANGELOG:-}" ]; then
            CHANGELOG="$(sed -n "/^## ${VERSION_NAME}\$/,/^## /p" CHANGELOG.md | sed '1d;$d' | sed '/^$/d')"
          fi
          printf '%s' "$CHANGELOG" > changelog.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file changelog.md
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file changelog.md --target "$GITHUB_SHA"
          fi
          gh release upload "$RELEASE_TAG" "$DOWNLOAD_APK" --clobber
